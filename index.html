<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mimin Chatbot Widget</title>
    <link rel="stylesheet" href="/dist/chat-widget.css" />
  </head>

  <body>
    <div class="h-[200vh]">
      <h1>Mimin Chatbot Widget Demo</h1>
    </div>

    <script type="module">
      import { Chatbot } from '/src/index.tsx'

      // Theme is loaded remotely, mirroring chatbot-ui flow:
      // GET /v1/api-credential/get/{username}/{api_credential_id} —
      // the embed only needs the minimal credentials below.
      Chatbot.init({
        widgetType: "chatbot", // "chatbot" | "voice-ai"
        credentials: {
          apiKey: import.meta.env.VITE_API_KEY || "YOUR_API_KEY",
          username: import.meta.env.VITE_USERNAME || "YOUR_USERNAME",
          websiteId: import.meta.env.VITE_WEBSITE_ID || "YOUR_WEBSITE_ID",
          apiUrl: import.meta.env.VITE_API_URL || undefined,
          // widgetType "chatbot" requires chatbotAgentId:
          chatbotAgentId: import.meta.env.VITE_CHATBOT_AGENT_ID || undefined,
          // widgetType "voice-ai" may omit voiceAgentId when the credential
          // has widget_voice_ai_agent_id set; otherwise:
          voiceAgentId: import.meta.env.VITE_VOICE_AGENT_ID || "YOUR_VOICE_AGENT_ID",
        },
      });
    </script>
  </body>
</html>
